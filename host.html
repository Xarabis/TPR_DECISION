*{box-sizing:border-box;margin:0;padding:0}
:root{--bg:#03050B;--cy:#36D7FF;--gold:#FFC53D;--red:#FF4A56;--grn:#3DFFA2;--tx:#E8F1FF;--mu:#9DB6DE}
html,body{width:100%;height:100%;background:#000;overflow:hidden;color:var(--tx);font-family:Manrope,system-ui,sans-serif}
#stage{position:absolute;left:50%;top:50%;transform:translate(-50%,-50%);overflow:hidden;background:radial-gradient(110% 80% at 50% 0%,#0b1a38 0%,#03050B 62%)}
#ui{position:absolute;left:0;top:0;width:1920px;height:1080px;transform-origin:0 0}
#ui>*{position:absolute}
.mono{font-family:"JetBrains Mono",ui-monospace,monospace}.disp{font-family:Unbounded,system-ui,sans-serif}
.grid{left:0;top:0;width:1920px;height:1080px;opacity:.07;background-image:linear-gradient(var(--cy) 1px,transparent 1px),linear-gradient(90deg,var(--cy) 1px,transparent 1px);background-size:80px 80px;mask-image:radial-gradient(70% 60% at 50% 40%,#000,transparent)}
.corner{width:46px;height:46px;border:0 solid rgba(54,215,255,.7)}
.tl{left:56px;top:50px;border-width:3px 0 0 3px}.tr{right:56px;top:50px;border-width:3px 3px 0 0}.bl{left:56px;bottom:50px;border-width:0 0 3px 3px}.br{right:56px;bottom:50px;border-width:0 3px 3px 0}
.tag{font-size:22px;letter-spacing:.3em;color:var(--mu);text-transform:uppercase}
#t1{left:124px;top:56px}#t2{right:124px;top:56px;text-align:right}#t3{left:124px;bottom:52px;color:var(--cy)}#t4{right:124px;bottom:52px;text-align:right;color:var(--mu)}
#body{left:0;top:0;width:1920px;height:1080px}
#body>*{position:absolute}
.h1{font-family:Unbounded,sans-serif;font-weight:700;color:var(--gold);text-shadow:0 0 44px rgba(255,197,61,.45);text-align:center;width:1920px;left:0}
.sub{text-align:center;width:1920px;left:0;color:var(--tx)}
.card{border-radius:20px;border:2px solid rgba(54,215,255,.45);background:linear-gradient(180deg,rgba(11,22,44,.88),rgba(6,12,26,.78));box-shadow:0 0 44px rgba(54,215,255,.12)}
.card.gold{border-color:rgba(255,197,61,.7)}
.card.lift{border-color:rgba(61,255,162,.6)}
.k{font-size:24px;letter-spacing:.3em;color:var(--mu)}
.chips{display:flex;flex-wrap:wrap;gap:10px;align-content:flex-start}
.chip{font:600 26px Manrope,sans-serif;border:1.5px solid rgba(54,215,255,.4);border-radius:30px;padding:6px 18px;color:var(--tx);background:rgba(8,16,34,.7);white-space:nowrap}
.chip.new{animation:pop .5s cubic-bezier(.2,1.4,.4,1)}@keyframes pop{from{transform:scale(.6);opacity:0}}
.chip.ok{border-color:var(--grn);color:var(--grn);background:rgba(61,255,162,.08)}
.chip.bad{border-color:var(--red);color:#FF6A6A;background:rgba(255,74,86,.08);text-decoration:line-through}
.chip.auto{border-style:dashed;color:var(--mu)}
.chip.pend{opacity:.35}
.chip i{font:700 22px "JetBrains Mono",monospace;font-style:normal;margin-left:10px}
.bar{height:22px;border-radius:11px;background:#0A1428;overflow:hidden}.bar i{display:block;height:100%;background:linear-gradient(90deg,var(--cy),#7be9ff);box-shadow:0 0 18px var(--cy);transition:width .4s}
.hint{left:0;bottom:104px;width:1920px;text-align:center;font-size:24px;letter-spacing:.24em;color:var(--mu)}

      var max = size - margin;

      var black = Array(cellSize+1).join('  ');

      var ascii = '';
      var line = '';
      for (y = 0; y < size; y += 1) {

        for (x = 0; x < size; x += 1) {

      h += '<div class="k mono" style="left:0;top:130px;width:1920px;text-align:center">ГОЛОСОВАНИЕ ЗАКРЫТО · ЭТАЖ ' + v.round + '</div>';
      h += '<div class="h1" style="top:172px;font-size:88px">КТО ЧТО ВЫБРАЛ</div>';
      if (f.lift) {
        h += col(80, 'ЗАБРАТЬ ' + f.hand, tk.length, tk, 'var(--cy)', '', false, 560);
        h += col(680, 'ЛЕСТНИЦА', go.length, go, 'var(--gold)', 'gold', false, 560);
        h += col(1280, 'ЛИФТ', lf.length, lf, 'var(--grn)', 'lift', false, 560);
      } else {
        h += col(120, 'ЗАБРАТЬ ' + f.hand, tk.length, tk, 'var(--cy)', '');
        h += col(1000, 'ИДТИ ДАЛЬШЕ', go.length, go, 'var(--gold)', 'gold');
      }
      h += hint('<b>ПРОБЕЛ</b> — БРОСИТЬ КУБИК');
    } else if (ph === 'revealed') {
      var took = ps.filter(function (p) { return p.res && p.res.ch === 'take'; }), gos = ps.filter(function (p) { return p.res && p.res.ch === 'go'; }), lfs = ps.filter(function (p) { return p.res && p.res.ch === 'lift'; });
      var passed = gos.filter(function (p) { return p.res.pass; }).length, lup = lfs.filter(function (p) { return p.res.up; }).length;
      h += '<div class="k mono" style="left:0;top:130px;width:1920px;text-align:center">КУБИК 0–99 · ' + (f.lift ? 'ЛЕСТНИЦА: МЕНЬШЕ ' + f.chance + ' · ЛИФТ ВВЕРХ: МЕНЬШЕ 70' : 'ПРОХОД, ЕСЛИ МЕНЬШЕ ' + f.chance) + '</div>';
      h += '<div class="h1" style="top:172px;font-size:' + (f.lift && lfs.length ? 66 : 88) + 'px">' + (f.lift && lfs.length ? 'ЛИФТ ВВЕРХ ' + lup + ' ИЗ ' + lfs.length + ' · ЛЕСТНИЦА ' + passed + ' ИЗ ' + gos.length : gos.length ? 'ПРОШЛИ ' + passed + ' ИЗ ' + gos.length : 'НИКТО НЕ РИСКНУЛ') + '</div>';
      if (f.lift) {
        h += col(80, 'ЗАБРАЛИ', took.length, took, 'var(--cy)', '', true, 560);
        h += col(680, 'ЛЕСТНИЦА', gos.length, gos, 'var(--gold)', 'gold', true, 560);
        h += col(1280, 'ЛИФТ', lfs.length, lfs, 'var(--grn)', 'lift', true, 560);
      } else {
        h += col(120, 'ЗАБРАЛИ', took.length, took, 'var(--cy)', '', true);
        h += col(1000, 'ИДУТ ДАЛЬШЕ', gos.length, gos, 'var(--gold)', 'gold', true);
      }
      var more = v.round < 3 && ps.some(function (p) { return p.a; });
      h += hint('<b>ПРОБЕЛ</b> — ' + (more ? 'ЭТАЖ ' + (v.round + 1) : 'ПОКАЗАТЬ ИТОГИ'));
      var els = B.querySelectorAll('.chip.pend');   /* кубики появляются по очереди */
      void els;
    } else if (ph === 'final') {
      var fi = v.final;
      h += '<div class="k mono" style="left:0;top:120px;width:1920px;text-align:center">ИГРА ЗАКОНЧЕНА · КТО БОЛЬШЕ ВСЕХ ЗАРАБОТАЛ</div>';
      h += '<div class="h1" style="top:150px;font-size:76px">ТОП-10</div>';
      h += '<div class="card gold" style="left:140px;top:262px;width:1060px;padding:4px 14px"><table>' + fi.top.map(function (p, i) { return '<tr class="' + (i === 0 ? 'first' : '') + '"><td class="r">' + p.r + '</td><td class="n">' + esc(p.n) + '</td><td class="b">' + p.b + '</td></tr>'; }).join('') + '</table></div>';
      h += '<div class="card" style="left:1280px;top:262px;width:500px;padding:30px 34px"><div class="k mono" style="font-size:20px">ИГРОКОВ</div><div class="disp" style="font-size:60px;font-weight:700">' + fi.n + '</div><div class="k mono" style="font-size:20px;margin-top:22px">СРЕДНИЙ БАЛАНС ЗАЛА</div><div class="disp" style="font-size:60px;font-weight:700;color:var(--gold)">' + String(fi.avg).replace('.', ',') + '</div><div class="k mono" style="font-size:20px;margin-top:22px">ОСТАЛИСЬ С НУЛЁМ</div><div class="disp" style="font-size:60px;font-weight:700;color:#FF6A6A">' + fi.zero + '</div></div>';
      h += '<div class="card" style="left:1280px;top:700px;width:500px;padding:20px 34px;border-color:rgba(255,197,61,.6)"><div style="font-size:24px;line-height:1.3"><b style="color:var(--gold)">Расчёт:</b> лучшая стратегия (идти до 3-го этажа) даёт в среднем ' + fi.theory + '. Один забег — это случай.' + (fi.lift && fi.lift.n ? '<br><b style="color:var(--grn)">Лифт:</b> выбрали ' + fi.lift.n + ', вверх ' + fi.lift.up + ', их средний баланс ' + String(fi.lift.avg).replace('.', ',') + '. Расчёт: лифт ' + fi.lift.ev + ', лестница ' + fi.lift.stairs + ', «забрать» 150.' : '') + '</div></div>';
      h += hint('<b>Р</b> — НОВАЯ ИГРА');
    }
    B.innerHTML = h;
    $('#ctl').style.display = ph === 'lobby' ? 'block' : 'none';
    if (ph === 'revealed') animateRolls();
  }
  function col(x, title, n, list, color, cls, rolls, w) {
    w = w || 800;
    var chipsH = list.map(function (p) {
      if (!rolls) return '<span class="chip' + (p.au ? ' auto' : '') + '">' + esc(p.n) + (p.au ? ' ·авто' : '') + (v0.floor && v0.floor.hand !== p.g ? ' ·' + p.g : '') + '</span>';
      if (p.res.ch === 'take') return '<span class="chip ok">' + esc(p.n) + '<i>' + p.b + '</i></span>';
      if (p.res.ch === 'lift') return '<span class="chip pend" data-ok="' + (p.res.up ? 1 : 0) + '" data-roll="' + (p.res.up ? '↑ ' : '↓ пусто ') + p.res.roll + '" data-nm="' + esc(p.n) + '">' + esc(p.n) + '</span>';
      return '<span class="chip pend" data-ok="' + (p.res.pass ? 1 : 0) + '" data-roll="' + p.res.roll + '" data-nm="' + esc(p.n) + '">' + esc(p.n) + '</span>';
    }).join('');
    return '<div class="card ' + cls + '" style="left:' + x + 'px;top:290px;width:' + w + 'px;height:600px;padding:30px 34px"><div style="display:flex;justify-content:space-between;align-items:baseline"><div class="disp" style="font-size:' + (w < 700 ? 30 : 44) + 'px;font-weight:700;color:' + color + '">' + title + '</div><div class="disp" style="font-size:' + (w < 700 ? 60 : 70) + 'px;font-weight:700">' + n + '</div></div><div class="chips" style="margin-top:22px;max-height:450px;overflow:hidden">' + (chipsH || '<span class="mono" style="font-size:24px;color:#5F7399">никого</span>') + '</div></div>';
  }
  function animateRolls() {
    var els = B.querySelectorAll('.chip.pend');
    els.forEach(function (c, i) {
      timers.push(setTimeout(function () {
        var ok = c.getAttribute('data-ok') === '1'; c.classList.remove('pend'); c.classList.add(ok ? 'ok' : 'bad');
        c.innerHTML = c.innerHTML + '<i>' + c.getAttribute('data-roll') + '</i>';
      }, 400 + Math.min(i, 40) * 90));
    });
  }
  addEventListener('keydown', function (e) {
    var k = e.key;
    if (k === ' ' || k === 'ArrowRight' || k === 'Enter') { advance(); e.preventDefault(); }
    else if (k === 'r' || k === 'R' || k === 'к' || k === 'К') { if (KEY && confirm('Начать игру заново? Имена останутся, баланс обнулится.')) post({ action: 'reset' }); }
    else if (k === 'u' || k === 'U' || k === 'г' || k === 'Г') { urlIdx++; lastSig = ''; render(); }
    else if (k === 'f' || k === 'F' || k === 'а' || k === 'А') { if (document.fullscreenElement) document.exitFullscreen(); else document.documentElement.requestFullscreen(); }
  });
  addEventListener('click', function (e) { if (e.target.closest('.hint') || e.target === document.body) advance(); });
  connect();
})();
</script></body></html>
